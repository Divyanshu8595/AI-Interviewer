services:
  backend:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./local_interviewer.db:/app/local_interviewer.db"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    volumes: ["./frontend:/app"]
